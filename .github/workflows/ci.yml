name: Nexo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: ci-only-secret-key-never-use-in-production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://api.nexo.test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests and coverage thresholds
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build

  deploy-render:
    name: Deploy Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Deploy tested commit and wait for Render
        run: python .github/scripts/deploy_render.py

  deploy-vercel:
    name: Deploy Vercel
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate deployment settings
        run: |
          for setting in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing secret $setting in the production environment"
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # Run from repository root; Vercel applies its configured frontend Root Directory.
      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate public production API URL
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('.vercel/.env.production.local', 'utf8');
          const match = config.match(/^VITE_API_BASE_URL=(.*)$/m);
          let value = match?.[1]?.trim() ?? '';
          if (value.startsWith('"')) value = JSON.parse(value);
          else if (value.startsWith("'")) value = value.slice(1, -1);
          try {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.hostname.endsWith('.test')) throw new Error();
          } catch {
            console.error('::error::VITE_API_BASE_URL must be a readable HTTPS production URL. In Vercel, save it as Config (Sensitive disabled), not Secret, then rerun this job.');
            process.exit(1);
          }
          console.log('Production API URL validated.');
          NODE
      - name: Build production frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy and wait for production frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
